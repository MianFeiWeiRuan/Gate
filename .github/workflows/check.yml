name: VPN Gate Node Check

on:
  # 每 30 分钟运行一次（UTC 时间）
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write      # 改：keep-alive commit 需要写权限
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_WORKER: "https://fco.us.ci/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      # ===== keep-alive：每次运行都提交一次，防止仓库 60 天休眠 =====
      - name: Keep-alive commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last_run.txt
          git add .keepalive/last_run.txt
          if git diff --cached --quiet; then
            echo "无变化，跳过 commit"
          else
            git commit -m "chore: keep-alive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # ===== Pages 部署 =====
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "site: https://MianFeiWeiRuan.github.io/Gate/"
          echo "deploy outcome: ${{ steps.deployment.outcome }}"
